aid: stori
name: Stori
description: >-
  Stori is a Mexico City–headquartered fintech (operating as a regulated
  Sociedad Financiera Popular under CNBV and CONDUSEF oversight) on a mission
  to democratize credit access for the roughly 400 million underbanked
  consumers in Latin America. Founded in 2019, the company achieved unicorn
  status in 2022 and has raised over $400M from investors including GGV
  Capital, General Catalyst, Lightspeed Venture Partners, Goodwater Capital,
  Source Code Capital, Vision Plus Capital, BAI Capital, Tresalia, and GIC.
  Stori's flagship product is the Stori Card, an inclusive Visa credit card
  marketed to first-time borrowers with little or no formal credit history,
  alongside Stori Black (premium tier), co-branded cards (SHEIN, Farmacias
  Similares, sports teams), Cuenta+ (a commission-free deposit account
  advertising up to 15% annual returns), personal loans up to roughly
  $3,000 MXN-equivalent, and payment services covering bill pay, mobile
  recharges, and phone-based merchant collection. The platform is delivered
  exclusively through its iOS and Android mobile apps and serves more than
  five million Mexican users. Stori has no public developer API, SDK, CLI,
  webhook surface, or open-source release; its revenue model is interest,
  interchange, and fee income from consumer credit and deposit products,
  with operations in Mexico, Colombia, and a U.S. corporate presence in
  Arlington, Virginia.
